                "@type": "Answer",

            useEffect(() => {
                let cancelled = false;
                fetch(PRICES_URL, { cache: 'no-cache' })
                    .then(r => { if (!r.ok) throw new Error('prices.json returned ' + r.status); return r.json(); })
                    .then(data => {
                        if (cancelled) return;
                        setQuotes(data.quotes || {});
                        setSession(data.session || null);
                    })
                    .catch(err => {
                        console.warn(err);
                        if (!cancelled) setPriceError('Closing prices unavailable. Revenue figures below are unaffected.');
                    });
                return () => { cancelled = true; };
            }, []);

            const filteredStocks = useMemo(() => {
                let result = [...CANNABIS_STOCKS];

                if (filters.jurisdiction !== 'all') {
                    result = result.filter(s => s.jurisdiction === filters.jurisdiction);
                }
                if (filters.model !== 'all') {
                    result = result.filter(s => s.model === filters.model);
                }
                if (filters.taxRegime !== 'all') {
                    result = result.filter(s => s.taxRegime === filters.taxRegime);
                }
                // Rows the feed had nothing for sort to the bottom rather than
                // being silently treated as zero.
                const nullsLast = (x, y) => {
                    if (x === null && y === null) return 0;
                    if (x === null) return 1;
                    if (y === null) return -1;
                    return y - x;
                };

                result.sort((a, b) => {
                    switch (filters.sortBy) {
                        case 'pe': {
                            const pa = quotes[a.ticker]?.trailingPE ?? null;
                            const pb = quotes[b.ticker]?.trailingPE ?? null;
                            if (pa === null && pb === null) return 0;
                            if (pa === null) return 1;
                            if (pb === null) return -1;
                            return pa - pb;
                        }
                        case 'name':
                            return a.name.localeCompare(b.name);
                        default:
                            return nullsLast(capOf(quotes[a.ticker]), capOf(quotes[b.ticker]));
                    }
                });

                return result;
            }, [filters, quotes]);

                            </div>

                            {/* Author positions. Kept above the fold deliberately. */}
                            <div className="bg-gray-900/70 border border-gray-700/60 rounded-xl p-4 mb-4">
                                <h2 className="text-sm font-bold text-gray-200 mb-1">Disclosure</h2>
                                <p className="text-xs text-gray-400 leading-relaxed">
                                    The author holds long positions in TRLV, GTBIF, CURLF and CRLBF. This page reports
                                    company figures as filed and does not rate, score or forecast any security.
                                </p>
                            </div>

                            {/* Where reform actually lands */}
                            <div className="bg-gradient-to-r from-amber-950/40 via-orange-950/30 to-red-950/30 border border-amber-700/40 rounded-xl p-4 mb-4">
                                <div className="flex items-start gap-3">
                                    <div className="w-8 h-8 rounded-lg bg-amber-900/50 flex items-center justify-center flex-shrink-0 mt-0.5">
                                        <svg className="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                        </svg>
                                    </div>
                                    <div>
                                        <h2 className="text-sm font-bold text-amber-300 mb-1">Where US reform actually lands</h2>
                                        <p className="text-xs text-gray-400 leading-relaxed">
                                            The April 2026 DOJ order, effective April 28, moved state-licensed medical
                                            cannabis and FDA-approved marijuana products to Schedule III. Because 280E
                                            reaches only Schedule I and II substances, qualifying medical activity left
                                            280E for the 2026 tax year. Adult-use did not move and remains fully exposed.
                                            Dual-licence operators have to allocate shared costs between the two, and
                                            Treasury has not issued that guidance. Whether relief runs backwards is
                                            unsettled: the IRS has sued to recover refunds already paid on amended
                                            returns. Non-US companies were never in scope for any of this.
                                        </p>
                                    </div>
                                </div>
                            </div>

                            <p className="text-gray-400 max-w-2xl">
                                Cannabis stock screener. Every company is classified by jurisdiction and business model
                                separately, so a Canadian retailer is not filed under &ldquo;licensed producer&rdquo; and a
                                brand licensor is not counted as plant-touching.
                            </p>

                            <div className="mt-6 max-w-2xl">
                                <h2 className="text-xl font-bold text-gray-100 mb-2">Largest cannabis companies by market cap (2026)</h2>
                                <p className="text-gray-400 text-sm leading-relaxed mb-2">
                                    Ranked by market cap, recalculated from each trading day&rsquo;s closing prices. The
                                    list runs from US multi-state operators like Curaleaf, Green Thumb Industries and
                                    Trulieve to Canadian producers like Tilray and Canopy Growth.
                                </p>
                                <p className="text-gray-400 text-sm leading-relaxed">
                                    Unlike static &ldquo;biggest cannabis companies&rdquo; lists, this one adds the
                                    structural detail that drives the tax question: whether a company is plant-touching in
                                    the US at all, and if so, how much of its footprint sits in medical-only states that
                                    left 280E in April 2026 versus adult-use states that did not.
                                </p>
                            </div>
                        </div>

                        <div className="mb-4 px-4 py-2 bg-gray-900/50 border border-gray-800 rounded-lg">
                            <span className="text-xs text-gray-500">
                                {priceError
                                    ? priceError
                                    : session
                                        ? `Closing prices for the ${session} session. Updated once each trading day.`
                                        : 'Loading closing prices'}
                            </span>
                        </div>

                        <div className="mb-6 bg-gray-900/60 border border-gray-800 rounded-xl p-5">
                            <h2 className="text-lg font-bold text-gray-100 mb-3">Why this page shows so few numbers</h2>
                            <div className="space-y-3 text-sm text-gray-400 leading-relaxed max-w-3xl">
                                <p>
                                    Reported financials are deliberately absent. Revenue, margins, cash flow and debt are
                                    not shown here, for two reasons. The first is comparability: a US plant-touching
                                    operator spent years paying federal tax on something close to gross profit rather
                                    than net income, because 280E denied it ordinary deductions, while a Canadian
                                    producer with identical revenue never carried that. The second is that several
                                    operators are actively restructuring around the medical and adult-use tax line,
                                    shedding or deconsolidating businesses, which moves the reported figures faster than
                                    any static page can track. A number that is stale is indistinguishable from a
                                    current one once it is on screen.
                                </p>
                                <p>
                                    What remains is either pulled fresh each trading day &mdash; market cap, closing
                                    price, trailing earnings &mdash; or is a matter of public record: where a company is
                                    incorporated, what kind of business it runs, which states it operates in, and what
                                    tax position it has publicly stated. Financial detail will return as it is sourced to
                                    filings on a consistent basis, and not before.
                                </p>
                                <p>
                                    Since April 28, 2026 the distinction runs inside the US group as well. State-licensed
                                    medical cannabis moved to Schedule III and left 280E; adult-use stayed on Schedule I
                                    and did not. Two operators with the same revenue can now report materially different
                                    after-tax results purely on licence mix. Dual-licence operators have to apportion
                                    shared costs between the two, and Treasury has not issued that guidance, so even the
                                    operators themselves are working from estimates.
                                </p>
                                <p>
                                    A further complication: several operators adopted non-280E filing positions before any
                                    rescheduling, asserting the section did not apply to their cannabis operations at all
                                    rather than only to medical activity. Curaleaf adopted that position in Q2 2024.
                                    Where a company files this way, its reported tax expense reflects a contested legal
                                    interpretation, not settled law, and the balance sheet typically carries an uncertain
                                    tax position against it. The IRS has rejected these arguments in Tax Court and sued at
                                    least one operator to recover a refund already paid.
                                </p>
                                <p>
                                    Trailing P/E is shown because the relief is only now beginning to produce positive
                                    earnings, after years where the ratio meant nothing. Two cautions. Trailing twelve
                                    month figures still cover the 280E years, so the US operators mostly show no
                                    earnings yet even where the current quarter looks different &mdash; the relief will
                                    appear in this column over the coming quarters, not today. And reported earnings in
                                    this window can be flattered by one-time tax items rather than operations:
                                    Curaleaf&rsquo;s $98.7M income tax benefit came largely from releasing $97.0M of
                                    previously recorded reserves, which lifts trailing EPS once and does not repeat.
                                    Where a company has no trailing earnings the cell reads n/a rather than showing a
                                    negative or blank ratio.
                                </p>
                                <p className="text-gray-500">
                                    None of this tells you what any of these companies is worth. It tells you that the
                                    reported numbers are not measuring a common thing, and that some of them rest on
                                    positions still being litigated. Read the stated tax position on each company before
                                    reading anything into the ratios.
                                </p>
                            </div>
                        </div>

                        <StatsHeader stocks={filteredStocks} />
                        <FilterPanel filters={filters} setFilters={setFilters} />

                        <div className="space-y-4">
                            {filteredStocks.map(stock => (
                                <StockCard
                                    key={stock.ticker}
                                    stock={stock}
                                    quote={quotes[stock.ticker]}
                                    expanded={expandedStock === stock.ticker}
                                    onToggle={() => setExpandedStock(expandedStock === stock.ticker ? null : stock.ticker)}
                                />
                            ))}
                        </div>

                        {filteredStocks.length === 0 && (
                            <div className="text-center py-12 text-gray-500">
                                Nothing matches these filters. Widen the jurisdiction or revenue range.
                            </div>
                        )}

                        <div className="mt-12 pt-8 border-t border-gray-800/60">
                            <h2 className="text-sm font-semibold text-gray-300 mb-2">How to read this</h2>
                            <p className="text-xs text-gray-500 leading-relaxed max-w-2xl mb-2">
                                Jurisdiction and business model are recorded separately because they are separate facts.
                                A licensed producer holds a federal cultivation, processing or sale licence under
                                Canada&rsquo;s Cannabis Act. A retailer is licensed provincially and holds no such licence.
                                Grouping both under &ldquo;Canadian LP&rdquo; misstates what the companies are, so this
                                screener does not.
                            </p>
                            <p className="text-xs text-gray-500 leading-relaxed max-w-2xl mb-2">
                                280E status is derived from public statute and each operator&rsquo;s disclosed state
                                footprint. It is reported as a count of states, never as a share of revenue or an
                                estimated dollar saving, because operators do not disclose revenue by licence type.
                                Where a company has publicly stated a tax position, that statement is reported as its own
                                field. A blank field means not yet researched.
                            </p>
                            <p className="text-xs text-gray-500 leading-relaxed max-w-2xl mb-2">
                                Market cap, closing price, trailing P/E and trailing EPS are pulled once each trading day
                                and are shown only where that day&rsquo;s file contains them. There is no stored fallback,
                                so a blank cell means the data was not retrieved rather than that the value is zero.
                                Reported financials are omitted until they are sourced to filings on a consistent basis.
                            </p>
                            <p className="text-xs text-gray-600 leading-relaxed max-w-2xl">
                                Nothing on this page is investment advice.
                            </p>
                            <div className="mt-4 flex items-center gap-4 text-xs">
                                <a href="https://www.dankreports.com" className="text-emerald-500 hover:text-emerald-400">dankreports.com</a>
                                <a href="https://tracker.dankreports.com" className="text-emerald-500 hover:text-emerald-400">Legislation tracker</a>
                                <a href="https://prices.dankreports.com" className="text-emerald-500 hover:text-emerald-400">Price tracker</a>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
